# Propszy Nginx Configuration for AWS EC2 (Ubuntu / Debian)
# Place this file in /etc/nginx/sites-available/propszy.conf
# and symlink to /etc/nginx/sites-enabled/
#
# Production domain configured for propszy.com and www.propszy.com
# (Or optionally point to EC2 Public IP / DNS).

# Upstream Node.js API cluster
upstream propszy_api {
    server 127.0.0.1:5050;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name propszy.com www.propszy.com;

    # Maximum file upload size for project & property images/videos
    client_max_body_size 50M;

    # Gzip Compression for fast delivery
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # 1. API Endpoints -> Proxy to Express backend
    location /api/ {
        proxy_pass http://propszy_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts for large uploads
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # 2. Uploaded Media -> Proxy to backend or serve directly from disk
    location /uploads/ {
        # Option A: Proxy to Express static handler (simple & reliable)
        proxy_pass http://propszy_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";

        # Option B (High performance): direct static serving from disk
        # alias /var/www/propszy/backend/uploads/;
        # expires 30d;
        # add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # 3. Health Check
    location = /health {
        proxy_pass http://propszy_api/health;
        proxy_set_header Host $host;
    }

    # 4. Frontend SPA (Vite React Build)
    root /var/www/propszy/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static frontend assets (hashes ensure no stale files)
    location ~* \.(?:css|js|woff2?|svg|gif|png|jpg|jpeg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Deny access to hidden files (.env, .git, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
